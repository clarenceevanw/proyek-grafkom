<!doctype html>
<html lang="id" class="theme-knuckles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Knuckles Transform Lab</title>
  <link rel="stylesheet" href="./css/viewer.css">
</head>
<body>
  <div id="status" class="hud-status" aria-live="polite">Memuat Knuckles...</div>
  <div class="hud-keys" aria-label="Keybinds">
    1 Idle &nbsp; 2 Jalan &nbsp; 3 Lari &nbsp; 4 Tinju &nbsp; 5 Push Up &nbsp; 6 Arm Circles
  </div>
  <div class="hud-checklist">
    <button class="hud-checklist-toggle" id="checklist-toggle" type="button">Checklist Bentuk</button>
    <div class="hud-checklist-panel" id="checklist-panel">
      <div class="bulk-row">
        <button type="button" id="nodes-all">Centang semua</button>
        <button type="button" id="nodes-none">Kosongkan semua</button>
      </div>
      <div id="node-list" class="node-list" role="group" aria-label="Tampilkan part per node scene graph"></div>
    </div>
  </div>
  <div class="stage">
    <canvas id="gl" aria-label="Tampilan model Knuckles 3D"></canvas>
    <svg id="axis-gizmo" class="axis-gizmo" viewBox="0 0 100 100" role="img" aria-label="Sumbu koordinat 3D: X merah, Y hijau, Z biru">
      <circle cx="50" cy="50" r="3" class="axis-origin" />
      <g class="axis axis-x"><line x1="50" y1="50" x2="50" y2="50"/><text x="50" y="50">X</text></g>
      <g class="axis axis-y"><line x1="50" y1="50" x2="50" y2="50"/><text x="50" y="50">Y</text></g>
      <g class="axis axis-z"><line x1="50" y1="50" x2="50" y2="50"/><text x="50" y="50">Z</text></g>
    </svg>
  </div>
  <script type="module" src="./js/knuckles-viewer.js"></script>
</body>
</html>

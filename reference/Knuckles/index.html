<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Knuckles - WebGL (Sonic Forces: Speed Battles)</title>
    <style>
      html,body{
        margin:0;
        height:100%;
        background:#14161f;
        overflow:hidden;
        font-family:system-ui,sans-serif
      }
      canvas{
        display:block;
        width:100%;
        height:100%;
        touch-action:none
      }
      #ui{
        position:fixed;
        top:10px;
        left:10px;
        right:10px;
        display:flex;
        gap:6px;
        flex-wrap:wrap
      }
      button{
        background:#262b3d;
        color:#eee;
        border:1px solid #474e6c;
        border-radius:8px;
        padding:7px 12px;
        cursor:pointer;
        font-size:14px
      }
      button.on{
        background:#d61a38;
        border-color:#ff7088
      }
      #h{position:fixed;bottom:8px;left:10px;color:#8b91aa;font-size:12px}
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="h">Drag: putar kamera | Scroll: zoom | Tombol 1-5: animasi | Spasi: auto-rotate</div>
    <script src="script.js"></script>
  </body>
</html>

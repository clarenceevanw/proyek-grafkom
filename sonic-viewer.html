<!doctype html>
<html lang="id" class="theme-sonic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sonic Transform Lab</title>
  <link rel="stylesheet" href="./css/viewer.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Sonic Transform Lab</h1>
        <p>Viewer model 3D dan demonstrasi transformasi</p>
      </div>
      <div id="status" class="status" aria-live="polite">Memuat Sonic...</div>
    </header>
    <div class="workspace">
      <div class="stage">
        <canvas id="gl" aria-label="Tampilan model Sonic 3D"></canvas>
        <svg id="axis-gizmo" class="axis-gizmo" viewBox="0 0 100 100" role="img" aria-label="Sumbu koordinat 3D: X merah, Y hijau, Z biru">
          <circle cx="50" cy="50" r="3" class="axis-origin" />
          <g class="axis axis-x"><line x1="50" y1="50" x2="50" y2="50"/><text x="50" y="50">X</text></g>
          <g class="axis axis-y"><line x1="50" y1="50" x2="50" y2="50"/><text x="50" y="50">Y</text></g>
          <g class="axis axis-z"><line x1="50" y1="50" x2="50" y2="50"/><text x="50" y="50">Z</text></g>
        </svg>
      </div>
      <aside>
        <section>
          <h2>Mode demonstrasi</h2>
          <div class="button-grid" aria-label="Pilih mode transformasi">
            <button data-animation="idle" class="active">Idle</button>
            <button data-animation="translate">Lari maju</button>
            <button data-animation="rotate">Spin Bola</button>
            <button data-animation="arbitrary">Salto / Arbitrary</button>
          </div>
        </section>
        <section>
          <h2>Sudut kamera</h2>
          <div class="button-grid" aria-label="Pilih sudut kamera">
            <button data-view="front" class="active">Depan</button>
            <button data-view="back">Belakang</button>
            <button data-view="side">Samping</button>
            <button data-view="free">Free view</button>
          </div>
        </section>
        <section>
          <button id="reset" class="primary" style="width:100%">Reset pose</button>
        </section>
        <div id="mode-description" class="description" aria-live="polite">
          <strong id="mode-title">Idle</strong><span id="mode-copy">Sonic berada pada pose dasar dengan gerakan idle ringan.</span>
        </div>
        <p class="help">Drag model untuk memutar kamera. Scroll untuk zoom. Grafik XYZ menunjukkan orientasi kamera.</p>
      </aside>
    </div>
  </main>
  <script type="module" src="./js/sonic-viewer.js"></script>
</body>
</html>
